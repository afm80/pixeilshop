name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project files
        run: flutter create --platforms=android --org com.pixeilshop --project-name pixeilshop .
      - name: Patch Android (permissions, minSdk, ML Kit)
        run: python3 tool/patch_android.py
      - name: Bundle fonts (offline)
        run: python3 tool/fetch_fonts.py
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - name: Test
        run: flutter test
        continue-on-error: true
      - name: Build universal APK (arm64 + arm32 + x86_64)
        run: flutter build apk --release
      - name: Sign APK with my key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing in this repository (add the 4 ANDROID_* secrets)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my.jks"
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner sign \
            --ks "$RUNNER_TEMP/my.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            build/app/outputs/flutter-apk/app-release.apk
          $BT/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          rm -f "$RUNNER_TEMP/my.jks"
          echo "تم تفعيل التوقيع بمفتاحك."

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk pixeilshop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pixeilshop-apk
          path: pixeilshop.apk
