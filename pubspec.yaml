name: pixeilshop
description: Pixeilshop - محرر تصاميم وملصقات
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  http: ^1.2.2
  share_plus: ^10.0.2
  gal: ^2.3.0
  image: ^4.2.0
  file_picker: ^8.1.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_home.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
